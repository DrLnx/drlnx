<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Leon — Dr.Lnx, Developer at N3XT Agency">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D9470" stroke-opacity="0.08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1D9470" stop-opacity=".45"/><stop offset="1" stop-color="#1D9470" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#b8f5dc"/><stop offset="1" stop-color="#1D9470"/></linearGradient>
    <radialGradient id="glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".3"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D9470" stop-opacity="0"/><stop offset=".85" stop-color="#1D9470" stop-opacity=".16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-12px)}}
      .cur{animation:blink 1s step-end infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
      .drift{animation:drift 12s ease-in-out infinite}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,30px)}}
      @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(340px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinr{to{transform:rotate(-360deg)}}
      @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
      @keyframes flow{to{stroke-dashoffset:-40}}
      .o2{animation:drift2 18s ease-in-out infinite}
      .scan{animation:scan 6s linear infinite}
      .r1{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) .1s forwards}
      .r2{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) .35s forwards}
      .r3{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) .6s forwards}
      .r4{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) .85s forwards}
      .line{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.4s ease-out .5s forwards}
      .ring1{transform-origin:965px 170px;animation:spin 22s linear infinite}
      .ring2{transform-origin:965px 170px;animation:spinr 14s linear infinite}
      .ring3{transform-origin:965px 170px;animation:spin 9s linear infinite}
      .ping{transform-origin:92px 286px;animation:ping 2s ease-out infinite}
      .wire{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="drift" cx="260" cy="90" r="260" fill="url(#glow)"/>
    <circle class="o2" cx="980" cy="290" r="240" fill="url(#glow2)"/>
    <rect class="scan" width="1200" height="120" fill="url(#scan)"/>
    <circle class="ring1" cx="965" cy="170" r="118" fill="none" stroke="#1D9470" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 10"/>
    <g class="ring2"><circle cx="965" cy="170" r="88" fill="none" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="2" stroke-dasharray="120 60 30 60"/><circle cx="1053" cy="170" r="5" fill="#2dd4bf"/></g>
    <g class="ring3"><circle cx="965" cy="170" r="56" fill="none" stroke="#1D9470" stroke-width="2.5" stroke-dasharray="60 28"/><circle cx="965" cy="114" r="4" fill="#b8f5dc"/></g>
    <rect x="935" y="140" width="60" height="60" rx="14" fill="#0d1117" stroke="#1D9470" stroke-width="2"/>
    <text x="965" y="178" text-anchor="middle" class="mono" font-size="20" font-weight="700" fill="#b8f5dc">N3</text>
    <g fill="none" stroke="#1D9470" stroke-opacity=".7" stroke-width="1.5"><path class="wire" d="M847 170H790"/><path class="wire" d="M965 52V20"/><path class="wire" d="M965 288V320"/></g>
    <g class="r1"><text x="70" y="88" class="mono" font-size="16" fill="#1D9470">drlnx@github:~$ <tspan fill="#c9d1d9">whoami</tspan><tspan class="cur" fill="#1D9470">▍</tspan></text></g>
    <g class="r2"><text x="64" y="178" class="sans" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#title)">Leon</text></g>
    <path class="line" d="M70 200H330" stroke="#1D9470" stroke-width="3" stroke-linecap="round"/>
    <g class="r3"><text x="70" y="240" class="sans" font-size="24" fill="#e6edf3"><tspan font-weight="700" fill="#b8f5dc">Dr.Lnx</tspan> <tspan fill="#1D9470">·</tspan> Developer at <tspan font-weight="700" fill="#b8f5dc">N3XT Agency</tspan></text></g>
    <g class="r4">
      <rect x="70" y="268" width="292" height="36" rx="18" fill="#1D9470" fill-opacity=".12" stroke="#1D9470" stroke-opacity=".5"/>
      <circle class="ping" cx="92" cy="286" r="5" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle class="dot" cx="92" cy="286" r="5" fill="#2dd4bf"/>
      <text x="108" y="291" class="mono" font-size="14" fill="#c9d1d9">currently building <tspan fill="#b8f5dc" font-weight="700">N3XT.sys</tspan></text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="338.5" rx="17.5" fill="none" stroke="#1D9470" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
