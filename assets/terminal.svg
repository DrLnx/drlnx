<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="N3XT.sys boot sequence">
  <defs><style>
      .m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
      @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes type{from{transform:translateX(0)}to{transform:translateX(261.0px)}}
      @keyframes hide{to{opacity:0}}
      @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
      .l{opacity:0;animation:in .35s ease-out forwards}
      .d1{animation-delay:2.3s}.d2{animation-delay:2.9s}.d3{animation-delay:3.5s}.d4{animation-delay:4.1s}
      .d5{animation-delay:4.7s}.d6{animation-delay:5.9s}.d7{animation-delay:6.5s}.d8{animation-delay:7.2s}
      .cur{animation:blink 1s step-end infinite}
      .typer{animation:type 1.5s steps(29) .4s forwards}
      .tcur{animation:blink 1s step-end infinite, hide 0s linear 2.1s forwards}
      .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:fill 1.1s ease-in-out 4.8s forwards}
      .live{animation:glow 1.8s ease-in-out 7.2s infinite}
  </style></defs>
  <rect width="880" height="360" rx="14" fill="#0d1117"/>
  <rect x=".75" y=".75" width="878.5" height="358.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M14 .75H866A13.25 13.25 0 0 1 879.25 14V40H.75V14A13.25 13.25 0 0 1 14 .75Z" fill="#161b22"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
  <text x="440" y="26" text-anchor="middle" class="m" font-size="13" fill="#8b949e">n3xt — operator console</text>
  <g class="m">
    <text x="28" y="78" fill="#1D9470">❯</text>
    <text x="46" y="78" fill="#e6edf3" textLength="261.0" lengthAdjust="spacingAndGlyphs">n3xt deploy --guild community</text>
    <g class="typer"><rect x="46" y="60" width="281.0" height="26" fill="#0d1117"/><rect class="tcur" x="47" y="64" width="8" height="18" fill="#e6edf3"/></g>
    <text class="l d1" x="28" y="112" fill="#8b949e">▸ loading config <tspan fill="#484f58">··················</tspan> <tspan fill="#2dd4bf">ok</tspan></text>
    <text class="l d2" x="28" y="140" fill="#8b949e">▸ guild lock <tspan fill="#484f58">······················</tspan> <tspan fill="#2dd4bf">verified</tspan></text>
    <g class="l d3">
      <text x="28" y="168" fill="#8b949e">▸ modules</text>
      <text x="58" y="192" fill="#b8f5dc">tickets · moderation · recruitment · engagement · tempvoice</text>
      <text x="58" y="214" fill="#b8f5dc">surveys · anti-raid · appeals · audit-logs · panels</text>
    </g>
    <text class="l d4" x="28" y="246" fill="#8b949e">▸ restoring scheduled jobs <tspan fill="#484f58">········</tspan> <tspan fill="#2dd4bf">state recovered</tspan></text>
    <g class="l d5">
      <text x="28" y="274" fill="#8b949e">▸ tsc · eslint · vitest</text>
      <rect x="280" y="262" width="236" height="14" rx="3" fill="#161b22" stroke="#30363d"/>
      <rect class="bar" x="280" y="262" width="236" height="14" rx="3" fill="#1D9470"/>
    </g>
    <text class="l d6" x="530" y="274" fill="#2dd4bf">passed</text>
    <text class="l d7" x="28" y="312" fill="#e6edf3"><tspan fill="#2dd4bf" font-weight="700">✓</tspan> N3XT.sys online <tspan fill="#484f58">—</tspan> one bot, one dataset, one instance</text>
    <g class="l d8">
      <circle class="live" cx="836" cy="307" r="6" fill="#2dd4bf"/>
      <text x="28" y="340" fill="#1D9470">❯ <tspan class="cur" fill="#e6edf3">▍</tspan></text>
    </g>
  </g>
</svg>
