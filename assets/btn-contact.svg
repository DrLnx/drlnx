<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417 52" width="417" height="52" role="img" aria-label="CONTACT: leon.holetz@n3xt-agency.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D9470" stroke-opacity="0.08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1D9470" stop-opacity=".45"/><stop offset="1" stop-color="#1D9470" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="417" height="52" rx="12"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-12px)}}
      .cur{animation:blink 1s step-end infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
      .drift{animation:drift 12s ease-in-out infinite}
      @keyframes shine{0%,55%{transform:translateX(-120px) skewX(-20deg)}100%{transform:translateX(537px) skewX(-20deg)}}
      @keyframes nudge{0%,70%,100%{transform:translateX(0)}85%{transform:translateX(4px)}}
      .shine{animation:shine 4s ease-in-out infinite}
      .nudge{animation:nudge 2.4s ease-in-out infinite}
    </style></defs>
  <g clip-path="url(#c)">
    <rect width="417" height="52" fill="#161b22"/>
    <rect width="417" height="52" fill="url(#grid)"/>
    <rect class="shine" x="-100" y="-10" width="60" height="72" fill="#fff" fill-opacity="0.07"/>
  </g>
  <rect x=".75" y=".75" width="415.5" height="50.5" rx="11.25" fill="none" stroke="#1D9470" stroke-opacity="0.55" stroke-width="1.5"/>
  <g transform="translate(30 26)" color="#1D9470"><rect x="-10" y="-7" width="20" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M-9 -5.5L0 1.5L9 -5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
  <text x="56" y="31" class="mono" font-size="12" font-weight="600" letter-spacing="1" fill="#8b949e" textLength="50.4" lengthAdjust="spacingAndGlyphs">CONTACT</text>
  <text x="124.4" y="32" class="mono" font-size="15" font-weight="700" fill="#b8f5dc" textLength="243.0" lengthAdjust="spacingAndGlyphs">leon.holetz@n3xt-agency.com</text>
  <g transform="translate(393 26)" color="#b8f5dc"><g class="nudge"><path d="M-5 0H5M1 -4L5 0L1 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
