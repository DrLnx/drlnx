<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110e"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1D9470" stroke-opacity="0.08"/></pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1D9470" stop-opacity=".45"/><stop offset="1" stop-color="#1D9470" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="120" rx="16"/></clipPath>
    <linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b8f5dc"/></linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-12px)}}
      .cur{animation:blink 1s step-end infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
      .drift{animation:drift 12s ease-in-out infinite}
      @keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
      @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
      @keyframes flowk{to{stroke-dashoffset:-36}}
      @keyframes stk{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes wave{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.5);opacity:0}}
      .sw{animation:sweep 5s cubic-bezier(.6,0,.4,1) infinite}
      .t1{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
      .t2{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) .3s forwards}
      .ln{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.6s ease-out .5s forwards}
      .eq{transform-box:fill-box;transform-origin:center;animation:eq 1.2s ease-in-out infinite}
      .flow{stroke-dasharray:6 12;animation:flowk 1.4s linear infinite}
      .stk{animation:stk 2.4s ease-in-out infinite}
      .spin{transform-origin:1095px 60px;animation:spin 8s linear infinite}
      .wave{transform-origin:1095px 60px;animation:wave 1.8s ease-out infinite}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <rect width="1200" height="120" fill="url(#grid)"/>
    <circle class="drift" cx="120" cy="60" r="160" fill="url(#glow)"/>
    <rect class="sw" x="0" y="117" width="300" height="3" fill="url(#sweep)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="118.5" rx="15.25" fill="none" stroke="#1D9470" stroke-opacity=".35" stroke-width="1.5"/>
  <text x="44" y="78" class="mono" font-size="48" font-weight="700" fill="none" stroke="#1D9470" stroke-width="1.5">02</text>
  <path d="M128 30V90" stroke="#1D9470" stroke-opacity=".5"/>
  <g class="t1"><text x="150" y="46" class="mono" font-size="14" fill="#1D9470">// projects/n3xt.sys<tspan class="cur">▍</tspan></text></g>
  <g class="t2"><text x="148" y="88" class="sans" font-size="40" font-weight="800" letter-spacing="-.5" fill="url(#tt)">Work</text></g>
  <path class="ln" d="M270 74H990" stroke="#1D9470" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g fill="none" stroke="#1D9470" stroke-width="1.5"><path class="flow" d="M1030 60H1080V36H1130M1080 60V84H1150"/></g><circle class="dot" style="animation-delay:0s" cx="1030" cy="60" r="5" fill="#2dd4bf"/><circle class="dot" style="animation-delay:0.5s" cx="1130" cy="36" r="5" fill="#2dd4bf"/><circle class="dot" style="animation-delay:1s" cx="1150" cy="84" r="5" fill="#2dd4bf"/><rect x="1068" y="48" width="24" height="24" rx="6" fill="#0d1117" stroke="#b8f5dc" stroke-width="1.5"/>
</svg>
