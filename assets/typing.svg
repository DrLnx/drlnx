<g class="g3">
      <text x="164.0" y="37" class="mono" font-size="20" font-weight="600" fill="#1D9470" textLength="432.0" lengthAdjust="spacingAndGlyphs">If it runs twice, it runs on a cron.</text>
      <g class="k3"><rect x="164.0" y="8" width="472.0" height="44" fill="#0d1117"/><rect x="165.0" y="18" width="3" height="26" fill="#2dd4bf" class="cur"/></g>
