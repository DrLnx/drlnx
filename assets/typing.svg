<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 60" width="760" height="60" role="img" aria-label="Discord systems · Automation · Internal tooling / Private platforms for communities / One codebase. One dataset. One instance. / If it runs twice, it runs on a cron.">
  <defs><clipPath id="c"><rect x="1" y="1" width="758" height="58" rx="29"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-12px)}}
      .cur{animation:blink 1s step-end infinite}
      .dot{animation:pulse 2s ease-in-out infinite}
      .drift{animation:drift 12s ease-in-out infinite}
      @keyframes c0{0%{transform:translateX(0);animation-timing-function:steps(47)}8.000%{transform:translateX(564.0px)}20.500%{transform:translateX(564.0px);animation-timing-function:steps(47)}23.500%,100%{transform:translateX(0)}}
      @keyframes v0{0%,24.990%{visibility:visible}25.000%,100%{visibility:hidden}}
      .g0{visibility:hidden;animation:v0 20.0s linear 0.0s infinite}
      .k0{animation:c0 20.0s linear 0.0s infinite}
@keyframes c1{0%{transform:translateX(0);animation-timing-function:steps(33)}8.000%{transform:translateX(396.0px)}20.500%{transform:translateX(396.0px);animation-timing-function:steps(33)}23.500%,100%{transform:translateX(0)}}
      @keyframes v1{0%,24.990%{visibility:visible}25.000%,100%{visibility:hidden}}
      .g1{visibility:hidden;animation:v1 20.0s linear 5.0s infinite}
      .k1{animation:c1 20.0s linear 5.0s infinite}
@keyframes c2{0%{transform:translateX(0);animation-timing-function:steps(40)}8.000%{transform:translateX(480.0px)}20.500%{transform:translateX(480.0px);animation-timing-function:steps(40)}23.500%,100%{transform:translateX(0)}}
      @keyframes v2{0%,24.990%{visibility:visible}25.000%,100%{visibility:hidden}}
      .g2{visibility:hidden;animation:v2 20.0s linear 10.0s infinite}
      .k2{animation:c2 20.0s linear 10.0s infinite}
@keyframes c3{0%{transform:translateX(0);animation-timing-function:steps(36)}8.000%{transform:translateX(432.0px)}20.500%{transform:translateX(432.0px);animation-timing-function:steps(36)}23.500%,100%{transform:translateX(0)}}
      @keyframes v3{0%,24.990%{visibility:visible}25.000%,100%{visibility:hidden}}
      .g3{visibility:hidden;animation:v3 20.0s linear 15.0s infinite}
      .k3{animation:c3 20.0s linear 15.0s infinite}
    </style></defs>
  <rect x="1" y="1" width="758" height="58" rx="29" fill="#0d1117" stroke="#1D9470" stroke-opacity=".4"/>
  <g clip-path="url(#c)">
    <g class="g0">
      <text x="98.0" y="37" class="mono" font-size="20" font-weight="600" fill="#1D9470" textLength="564.0" lengthAdjust="spacingAndGlyphs">Discord systems · Automation · Internal tooling</text>
      <g class="k0"><rect x="98.0" y="8" width="604.0" height="44" fill="#0d1117"/><rect x="99.0" y="18" width="3" height="26" fill="#2dd4bf" class="cur"/></g>
